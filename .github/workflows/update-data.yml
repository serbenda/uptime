name: Update data

# Data goes to the `data` branch, which only ever holds the latest version (a single commit
# that gets replaced on every run). That way `main` only receives code changes through PRs.

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every 10 minutes (GitHub may delay or skip some)
  # After every merge the data is rebuilt with the new code, without waiting for the next slot
  push:
    branches: [main]
    paths: ["scripts/**", "data/providers.json", "data/places.json", ".github/workflows/update-data.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the data branch (untick to test changes without touching the site)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UPTIME_OUTPUT: ${{ github.workspace }}/out/data
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If the previous data can't be read, the run fails instead of starting from scratch:
      # starting from scratch would wipe 90 days of history on publish
      - name: Restore previous data
        run: |
          mkdir -p out/data
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          exists=$?
          set -e
          if [ "$exists" = "2" ]; then
            echo "The data branch doesn't exist yet: starting from scratch"
          elif [ "$exists" = "0" ]; then
            git fetch --depth=1 origin data
            git --work-tree=out checkout FETCH_HEAD -- data
            git reset -q
            test -s out/data/history.json || { echo "The data branch has no history.json"; exit 1; }
          else
            echo "Couldn't query the data branch (exit code $exists)"
            exit 1
          fi
          ls -la out/data

      - name: Read the status pages
        run: python scripts/update.py

      # On a test run the data goes to the `data-test` branch and the site doesn't change
      - name: Publish the data
        working-directory: out
        run: |
          branch=$([ "$PUBLISH" = "true" ] && echo data || echo data-test)
          git init -q
          git checkout -q --orphan "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

      # Opens (or comments on) the issue while a source has been down for 3 hours,
      # and closes it on its own once every source responds again
      - name: Open or close the "Data sources down" issue
        if: env.PUBLISH == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data sources down"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if python scripts/health.py > health.md; then
            cat health.md
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All sources are responding again. Closed automatically by $RUN_URL"
            fi
            exit 0
          fi
          cat health.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file health.md
          else
            gh issue create --title "$title" --body-file health.md
          fi
