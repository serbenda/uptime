name: Tests

on:
  pull_request:
  push:
    branches: [development]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
