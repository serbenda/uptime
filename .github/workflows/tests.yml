name: Tests

# Runs on every PR to main. A ruleset on main makes "Unit tests" a required check:
# a PR can't be merged until the tests pass.
on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
